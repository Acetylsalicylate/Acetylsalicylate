name: Generate SVG Card

on:
  push:
    paths:
      - 'card-data.json'
      - 'generate.js'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate card.svg
        run: node generate.js

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Spotify card SVG with Base64 image"
          file_pattern: card.svg
          commit_user_name: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_email: "github-actions[bot]@users.noreply.github.com>"
