name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Запуск ежедневно в полночь (можете изменить на "0 */6 * * *" для обновления каждые 6 часов)
  workflow_dispatch:     # Позволяет запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # 1. Генерация основной карточки статистики
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Acetylsalicylate&rank_icon=github&show_icons=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Генерация карточки языков
      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Acetylsalicylate&layout=compact&langs_count=4
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Фиксация и отправка изменений в репозиторий
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
